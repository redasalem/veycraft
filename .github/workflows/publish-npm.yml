name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate & Publish CLI Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Verify zero-dependency CLI, package contents & Skill Eval Harness
        run: |
          node --check bin/cli.mjs
          node --check bin/profile-intelligence.mjs
          node ./bin/cli.mjs eval --baseline
          node ./bin/cli.mjs eval --file evals/results/live-agent-eval-run.json
          node ./bin/cli.mjs eval --journeys
          npm run pack:check
          node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); if(Object.keys(p.dependencies||{}).length || Object.keys(p.devDependencies||{}).length) { process.exit(1); }"

      - name: Publish to npm with OIDC Sigstore Provenance (when NPM_TOKEN secret is configured)
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
