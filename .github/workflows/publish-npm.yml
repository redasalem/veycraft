name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate & Publish CLI Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: |
          node --version
          npm --version
          node -e "const [M,m,p]=require('node:child_process').execSync('npm --version',{encoding:'utf8'}).trim().split('.').map(Number); if(M<11||(M===11&&(m<5||(m===5&&p<1)))) process.exit(1);" || npm install -g npm@11
          npm --version

      - name: Verify zero-dependency CLI, package contents & Skill Eval Harness
        run: |
          node --check bin/cli.mjs
          node --check bin/profile-intelligence.mjs
          node ./bin/cli.mjs eval --baseline
          node ./bin/cli.mjs eval --file evals/results/live-agent-eval-run.json
          node ./bin/cli.mjs eval --journeys
          npm run pack:check
          node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); if(Object.keys(p.dependencies||{}).length || Object.keys(p.devDependencies||{}).length) { process.exit(1); }"

      - name: Publish to npm via OIDC Trusted Publishing with Sigstore Provenance
        run: |
          PKG_NAME="$(node -p "require('./package.json').name")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view "${PKG_NAME}@${PKG_VERSION}" version --registry=https://registry.npmjs.org 2>/dev/null || true)"
          if [ "$PUBLISHED" = "$PKG_VERSION" ]; then
            echo "[i] ${PKG_NAME}@${PKG_VERSION} is already published on npm — skipping publish cleanly."
            exit 0
          fi
          npm publish --provenance --access public
