name: Validate Markdown Skills & Zero-Dependency CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate all JSON files & zero-dependency invariant
        run: |
          python3 - <<'PY'
          import json, pathlib

          checked = 0
          for p in sorted(pathlib.Path(".").rglob("*")):
              if ".git" in p.parts or not p.is_file():
                  continue
              if p.suffix == ".json" or p.name.endswith(".json.example"):
                  json.loads(p.read_text(encoding="utf-8"))
                  checked += 1
          pkg = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))
          assert len(pkg.get("dependencies", {})) == 0, "package.json runtime dependencies must stay empty"
          assert len(pkg.get("devDependencies", {})) == 0, "package.json devDependencies must stay empty"
          print(f"Validated {checked} JSON file(s) and 0/0 npm dependencies.")
          PY

      - name: Validate all YAML files
        run: |
          ruby -ryaml -e '
            checked = 0
            Dir.glob("**/*", File::FNM_DOTMATCH).sort.each do |f|
              next if f.start_with?(".git/") || !File.file?(f)
              next unless f.end_with?(".yaml", ".yml", ".yaml.example")
              YAML.safe_load(File.read(f), aliases: true)
              checked += 1
            end
            puts "Validated #{checked} YAML file(s)."
          '

      - name: Validate skills frontmatter, registry, and Markdown links
        run: |
          python3 - <<'PY'
          import json, pathlib, re

          manifest = json.loads(pathlib.Path("skills/skills-manifest.json").read_text(encoding="utf-8"))
          registry = pathlib.Path("skills/REGISTRY.md").read_text(encoding="utf-8")
          required_keys = ["name", "version", "description", "triggers", "requires_mcp", "preconditions", "requires_skills", "verification"]
          required_sections = [
              "## When to Use & Preconditions",
              "## Deterministic Step-by-Step Execution",
              "## Anti-Patterns (What NEVER To Do) & Self-Verification Check",
          ]

          skill_files = sorted(
              p for p in pathlib.Path("skills").rglob("*.md")
              if p.name not in ("REGISTRY.md", "README.md") and not p.name.startswith("_")
          )
          manifest_paths = {pathlib.Path(s["path"]).as_posix() for s in manifest["skills"]}
          actual_paths = {p.as_posix() for p in skill_files}
          if manifest_paths != actual_paths:
              raise SystemExit(f"Manifest mismatch: missing={actual_paths - manifest_paths}, extra={manifest_paths - actual_paths}")

          for p in skill_files:
              text = p.read_text(encoding="utf-8")
              if not text.startswith("---"):
                  raise SystemExit(f"Missing YAML frontmatter: {p}")
              end = text.find("\n---", 3)
              if end < 0:
                  raise SystemExit(f"Unterminated YAML frontmatter: {p}")
              fm = text[3:end]
              for k in required_keys:
                  if not re.search(rf"^{re.escape(k)}:", fm, re.M):
                      raise SystemExit(f"{p} missing frontmatter key: {k}")
              body = text[end + 4:]
              for sec in required_sections:
                  if sec not in body:
                      raise SystemExit(f"{p} missing section: {sec}")
              if p.as_posix() not in registry:
                  raise SystemExit(f"{p} not indexed in skills/REGISTRY.md")

          agent_skills = sorted(pathlib.Path(".agents/skills").glob("*/SKILL.md"))
          expected_wrappers = {
              "apply-url", "contract-and-nda-auditor", "daily-run", "demo",
              "linkedin-growth", "offer-negotiator", "profile-intelligence-engine",
              "quick-tailor", "recruiter-inbox-triage", "rejection-pattern-analyzer",
              "score-calibration", "setup", "tailor-cv", "weekly-report",
          }
          actual_wrappers = {ap.parent.name for ap in agent_skills}
          if actual_wrappers != expected_wrappers:
              raise SystemExit(f".agents/skills mismatch: missing={expected_wrappers - actual_wrappers}, extra={actual_wrappers - expected_wrappers}")
          for ap in agent_skills:
              atext = ap.read_text(encoding="utf-8")
              if not atext.startswith("---"):
                  raise SystemExit(f"Missing YAML frontmatter: {ap}")
              aend = atext.find("\n---", 3)
              if aend < 0:
                  raise SystemExit(f"Unterminated YAML frontmatter: {ap}")
              afm = atext[3:aend]
              if not re.search(rf"^name:\s*{re.escape(ap.parent.name)}\s*$", afm, re.M):
                  raise SystemExit(f"{ap} frontmatter name must match folder {ap.parent.name}")
              if not re.search(r"^description:\s*\S.{19,}", afm, re.M):
                  raise SystemExit(f"{ap} missing valid description")

          broken = []
          for md in pathlib.Path(".").rglob("*.md"):
              if ".git" in md.parts:
                  continue
              text = md.read_text(encoding="utf-8")
              for m in re.finditer(r"\[[^\]]*\]\(([^)]+)\)", text):
                  target = m.group(1).split("#", 1)[0].strip()
                  if not target or re.match(r"^(https?:|mailto:|#)", target, re.I):
                      continue
                  if not (md.parent / target).resolve().exists():
                      broken.append(f"{md} -> {m.group(1)}")
              for m in re.finditer(r"(?<![A-Za-z0-9_./-])(skills/[A-Za-z0-9_./-]+\.md)(?![A-Za-z0-9_/-])", text):
                  if not pathlib.Path(m.group(1)).exists():
                      broken.append(f"{md} -> {m.group(1)}")
          if broken:
              raise SystemExit("Broken links:\n" + "\n".join(broken))
          print(f"Validated {len(skill_files)} skills, {len(agent_skills)} .agents/skills wrappers, REGISTRY.md, and 0 broken Markdown links.")
          PY

      - name: Security audit — ensure no sensitive files are tracked in Git
        run: |
          python3 - <<'PY'
          import re, subprocess

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad = [
              f for f in tracked
              if re.search(r"(\.pdf$|^\.env$|browser-profile|^logs/|^context/(?!.*\.example$|DROP_YOUR_FILES_HERE\.md$))", f)
          ]
          if bad:
              raise SystemExit("Sensitive files tracked in Git:\n" + "\n".join(bad))
          print(f"Security audit passed across {len(tracked)} tracked files.")
          PY

      - name: Security audit — scan skills for invisible Unicode / BiDi injection
        run: |
          python3 - <<'PY'
          import pathlib

          hits = []
          for base in ("skills", ".agents/skills"):
              root = pathlib.Path(base)
              if not root.exists():
                  continue
              for p in sorted(root.rglob("*")):
                  if not p.is_file():
                      continue
                  text = p.read_text(encoding="utf-8")
                  for idx, ch in enumerate(text):
                      cp = ord(ch)
                      if (0xE0000 <= cp <= 0xE007F) or (0x202A <= cp <= 0x202E) or (0x2066 <= cp <= 0x2069):
                          hits.append(f"{p.as_posix()}@offset {idx}: U+{cp:04X}")
          if hits:
              raise SystemExit("Invisible Unicode Tag or BiDi control characters detected:\n" + "\n".join(hits))
          print("Unicode/BiDi security audit passed across skills/ and .agents/skills/ (0 suspicious control chars).")
          PY

      - name: Provenance & Attribution Integrity Check
        run: |
          python3 - <<'PY'
          import json, pathlib

          required = ["NOTICE", "AUTHORS.md", "PROVENANCE.json", ".github/CODEOWNERS", "LICENSE"]
          for rel in required:
              p = pathlib.Path(rel)
              if not p.is_file():
                  raise SystemExit(f"Missing required provenance file: {rel}")
              text = p.read_text(encoding="utf-8")
              if "redasalem" not in text.lower():
                  raise SystemExit(f"Provenance file tampered (missing redasalem attribution): {rel}")

          notice = pathlib.Path("NOTICE").read_text(encoding="utf-8")
          assert "Copyright (c) 2026 Reda Salem (@redasalem)" in notice, "NOTICE copyright line mismatch"
          assert "https://github.com/redasalem/veycraft" in notice, "NOTICE canonical URL mismatch"

          prov = json.loads(pathlib.Path("PROVENANCE.json").read_text(encoding="utf-8"))
          assert prov.get("github_handle") == "redasalem", "PROVENANCE.json github_handle mismatch"
          assert prov.get("original_author") == "Reda Salem", "PROVENANCE.json original_author mismatch"
          assert prov.get("canonical_repository") == "https://github.com/redasalem/veycraft", "PROVENANCE.json canonical_repository mismatch"
          assert prov.get("verified_noreply_email") == "192090175+redasalem@users.noreply.github.com", "PROVENANCE.json verified_noreply_email mismatch"
          print("Provenance & attribution integrity check passed for all 5 required files.")
          PY

  cli-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Check CLI syntax, npm package manifest & run deterministic Skill Eval Harness + Journey Tests
        run: |
          node --check bin/fs-safety.mjs
          node --check bin/core-ops.mjs
          node --check bin/mcp-server.mjs
          node --check bin/ui-server.mjs
          node --check ui/app.js
          node --check bin/career-intelligence.mjs
          node --check bin/notion-sync.mjs
          node --check bin/cli.mjs
          node --check bin/profile-intelligence.mjs
          npm run pack:check
          node ./bin/cli.mjs --version --json
          node ./bin/cli.mjs eval --baseline
          node ./bin/cli.mjs eval --file evals/results/live-agent-eval-run.json
          node ./bin/cli.mjs eval --journeys

      - name: Test local init, doctor, eval, and sync-mcp in isolated directory
        shell: bash
        run: |
          TMP_BASE="$(mktemp -d)"
          trap 'rm -rf "$TMP_BASE"' EXIT
          ISO_HOME="$TMP_BASE/home"
          ISO_PROJ="$TMP_BASE/project"
          mkdir -p "$ISO_HOME" "$ISO_PROJ"
          REPO_DIR="$(pwd)"

          (
            cd "$ISO_PROJ"
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" init
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" doctor
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" eval --baseline
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" eval --journeys
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" proof
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" audit "$REPO_DIR/evals/fixtures/candidate-profile.md" --share
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" route "Improve my LinkedIn headline and About section" --json >/dev/null
            printf '<!doctype html><html><body><h1>Nadia Mansour</h1><p>Senior Full-Stack Engineer building TypeScript and Node.js systems.</p></body></html>\n' > "$ISO_PROJ/verify-sample.html"
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" verify "$ISO_PROJ/verify-sample.html" --facts "$REPO_DIR/evals/fixtures/candidate-profile.md"
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" pre-submit --text "Short grounded hiring manager note under 75 words."
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" status
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" bundle
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" dashboard --no-open
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" unlock
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" backup
            HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" sync-mcp
            MCP_OUT="$(printf '%s\n%s\n%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"1.0.0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
              | HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" node "$REPO_DIR/bin/cli.mjs" mcp)"
            MCP_OUT="$MCP_OUT" node -e 'const lines=(process.env.MCP_OUT||``).split(/\r?\n/).filter(Boolean);if(lines.length!==2)throw new Error(`Expected 2 frames, got ${lines.length}`);const frames=lines.map(l=>JSON.parse(l));if(frames.some(f=>f.jsonrpc!==`2.0`))throw new Error(`Invalid jsonrpc`);if(frames[0].id!==1||frames[0].result?.serverInfo?.name!==`veycraft`)throw new Error(`Bad init`);const tools=frames[1].result?.tools||[];if(frames[1].id!==2||tools.length!==8||!tools.some(t=>t.name===`veycraft_doctor`))throw new Error(`Bad tools`);'
          )

          test -f "$ISO_PROJ/AGENTS.md"
          test -f "$ISO_PROJ/config/invariants.txt"
          test -f "$ISO_PROJ/skills/REGISTRY.md"
          test -f "$ISO_PROJ/.agents/skills/daily-run/SKILL.md"
          test -f "$ISO_PROJ/.agents/skills/demo/SKILL.md"
          test -f "$ISO_PROJ/.agents/skills/quick-tailor/SKILL.md"
          test -f "$ISO_PROJ/.agent/workflows/quick-tailor.md"
          test -f "$ISO_PROJ/commands/quick-tailor.md"
          test -f "$ISO_PROJ/logs/exports/proof-card.svg"
          test -f "$ISO_PROJ/logs/exports/proof-card.md"
          test -f "$ISO_PROJ/logs/exports/cv-hygiene-card.svg"
          test -f "$ISO_PROJ/logs/exports/cv-hygiene-card.md"
          test -f "$ISO_PROJ/logs/exports/web-chat-master-prompt.md"
          test -f "$ISO_PROJ/logs/exports/dashboard.html"
          test -f "$ISO_PROJ/.mcp.json"
          test -f "$ISO_PROJ/.cursor/mcp.json"
          test -f "$ISO_PROJ/.gemini/settings.json"
          test -f "$ISO_PROJ/.vscode/mcp.json"
          test -f "$ISO_PROJ/.codex/config.toml"
          test -f "$ISO_PROJ/.github/copilot-instructions.md"
          test -f "$ISO_PROJ/.roo/rules/job-hunter.md"
          test -f "$ISO_PROJ/.kiro/steering/job-hunter.md"

      - name: Test global init and doctor in isolated HOME
        shell: bash
        run: |
          TMP_BASE="$(mktemp -d)"
          trap 'rm -rf "$TMP_BASE"' EXIT
          ISO_HOME="$TMP_BASE/home"
          mkdir -p "$ISO_HOME"
          REPO_DIR="$(pwd)"

          HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" CODEX_HOME="$ISO_HOME/.codex" node "$REPO_DIR/bin/cli.mjs" init --global
          HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" CODEX_HOME="$ISO_HOME/.codex" node "$REPO_DIR/bin/cli.mjs" doctor --global
          HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" CODEX_HOME="$ISO_HOME/.codex" node "$REPO_DIR/bin/cli.mjs" doctor --global --json >/dev/null
          HOME="$ISO_HOME" USERPROFILE="$ISO_HOME" CODEX_HOME="$ISO_HOME/.codex" node "$REPO_DIR/bin/cli.mjs" status --global --json >/dev/null
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            pwsh -NoProfile -File "$REPO_DIR/scripts/install.ps1" -DryRun >/dev/null
            pwsh -NoProfile -File "$REPO_DIR/scripts/install.ps1" -Uninstall >/dev/null
          else
            bash "$REPO_DIR/scripts/install.sh" --dry-run >/dev/null
            bash "$REPO_DIR/scripts/install.sh" --uninstall >/dev/null
          fi

          test -f "$ISO_HOME/.veycraft/AGENTS.md"
          test -f "$ISO_HOME/.agents/skills/daily-run/SKILL.md"
          test -f "$ISO_HOME/.agents/skills/quick-tailor/SKILL.md"
          test -f "$ISO_HOME/.codex/AGENTS.md"
          test -f "$ISO_HOME/.codex/config.toml"
          test -f "$ISO_HOME/.gemini/GEMINI.md"
          test -f "$ISO_HOME/.gemini/skills/daily-run/SKILL.md"
          test -f "$ISO_HOME/.gemini/settings.json"
          test -f "$ISO_HOME/.copilot/copilot-instructions.md"
          test -f "$ISO_HOME/.copilot/mcp-config.json"
          test -f "$ISO_HOME/.claude/skills/daily-run/SKILL.md"
          test -f "$ISO_HOME/.claude/skills/quick-tailor/SKILL.md"
          test -f "$ISO_HOME/.claude/commands/quick-tailor.md"
          test -f "$ISO_HOME/.cursor/rules/job-hunter.mdc"
          test -f "$ISO_HOME/.gemini/antigravity/global_workflows/daily-run.md"
          test -f "$ISO_HOME/.gemini/antigravity/global_workflows/quick-tailor.md"
          test -f "$ISO_HOME/.claude.json"
          test -f "$ISO_HOME/.cursor/mcp.json"
