# Safety settings read by every skill. Start with dry_run: true.
dry_run: true
# approve_before_submit is the only permitted live submission mode (no score-based or batch auto-submit bypass).
# dry_run: true always blocks final Submit clicks until explicitly disabled by the owner.
approval_mode: approve_before_submit
max_applications_per_day: 20
max_per_platform:
  linkedin: 12
  wellfound: 5
  wuzzuf: 5
  ashby: 3
  smartrecruiters: 3
  breezyhr: 3
  indeed: 3
  glassdoor: 3
  dice: 3
  ziprecruiter: 3
  weworkremotely: 3
  remoteok: 3
  builtin: 3
  welcometothejungle: 3
  # Unverified MENA boards default to 0 (manual_apply + needs_review until live-verified)
  bayt: 0
  gulftalent: 0
  # Unverified DACH board defaults to 0 (manual_apply + needs_review until live-verified)
  stepstone: 0
  greenhouse: 3
  lever: 3
  workday: 0
  taleo: 0
  other: 0
min_match_score: 7
# Compatibility-only legacy field; agent actions use human_behavior [3, 9] below.
delay_seconds: [3, 8]
max_consecutive_errors: 3
stop_on_captcha: true
review_min_score: 5
stop_on_2fa: true
tailor_resume_per_job: true
# batch_review_first: scan a batch, pre-generate tailored CV files, show the Mission Control table and wait for APPLY ALL GREEN / APPLY 1,3.
# direct_auto: legacy one-by-one flow. Both still obey dry_run, approval_mode, caps and every stop rule.
workflow_mode: batch_review_first
batch_size: 10
pregenerate_stretch_resumes: false
warmup_mode:
  # Also cap the first three distinct non-aborted run dates at 5; see agent-policy.ts.
  enabled: true
  started_on: null
  initial_cap: 5
  stage_days: 3
  increment: 5
active_hours:
  start: "09:00"
  end: "20:00"
  timezone: UTC
human_behavior:
  action_delay_seconds: [3, 9]
  scroll_jitter: false
  max_consecutive_actions: 15
  cooldown_seconds: 60
storage_adapters:
  local_json: true
  notion_mcp: false
  csv_export: true
  markdown_report: true
