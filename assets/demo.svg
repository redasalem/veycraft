<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-label="Veycraft v2.8.0 animated terminal demo: doctor health check, intent routing, and deterministic pre-submit safety gate">
  <defs>
    <linearGradient id="canvasBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050912"/>
      <stop offset="100%" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
    }
    .ui {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
    }
    .prompt { fill: #38bdf8; font-weight: 700; }
    .cmd { fill: #f8fafc; font-weight: 600; }
    .hdr { fill: #cbd5e1; font-weight: 600; }
    .ok { fill: #34d399; font-weight: 700; }
    .info { fill: #38bdf8; font-weight: 700; }
    .warn { fill: #fbbf24; font-weight: 700; }
    .body { fill: #e2e8f0; }
    .muted { fill: #94a3b8; }
    .em { fill: #6ee7b7; font-weight: 600; }

    /* Scene container visibility across 10.5s infinite loop (3.5s per scene) */
    .scene-1 { animation: sc1 10.5s linear infinite; }
    .scene-2 { animation: sc2 10.5s linear infinite; }
    .scene-3 { animation: sc3 10.5s linear infinite; }

    @keyframes sc1 {
      0%, 31.4% { opacity: 1; }
      33.3%, 98.8% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes sc2 {
      0%, 33.3% { opacity: 0; }
      34.6%, 64.8% { opacity: 1; }
      66.6%, 100% { opacity: 0; }
    }
    @keyframes sc3 {
      0%, 66.6% { opacity: 0; }
      67.9%, 98.1% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Scene 1 staggered line reveals (0% -> 33.3%) */
    .s1-l0 { animation: r10 10.5s ease-out infinite; }
    .s1-l1 { animation: r11 10.5s ease-out infinite; }
    .s1-l2 { animation: r12 10.5s ease-out infinite; }
    .s1-l3 { animation: r13 10.5s ease-out infinite; }
    .s1-l4 { animation: r14 10.5s ease-out infinite; }
    .s1-l5 { animation: r15 10.5s ease-out infinite; }
    .s1-l6 { animation: r16 10.5s ease-out infinite; }
    .s1-l7 { animation: r17 10.5s ease-out infinite; }
    .s1-l8 { animation: r18 10.5s ease-out infinite; }

    @keyframes r10 { 0% { opacity: 0.4; } 1.5%, 100% { opacity: 1; } }
    @keyframes r11 { 0%, 3.2% { opacity: 0; } 4.8%, 100% { opacity: 1; } }
    @keyframes r12 { 0%, 5.4% { opacity: 0; } 7.0%, 100% { opacity: 1; } }
    @keyframes r13 { 0%, 7.6% { opacity: 0; } 9.2%, 100% { opacity: 1; } }
    @keyframes r14 { 0%, 9.8% { opacity: 0; } 11.4%, 100% { opacity: 1; } }
    @keyframes r15 { 0%, 12.0% { opacity: 0; } 13.6%, 100% { opacity: 1; } }
    @keyframes r16 { 0%, 14.2% { opacity: 0; } 15.8%, 100% { opacity: 1; } }
    @keyframes r17 { 0%, 16.4% { opacity: 0; } 18.0%, 100% { opacity: 1; } }
    @keyframes r18 { 0%, 18.6% { opacity: 0; } 20.2%, 100% { opacity: 1; } }

    /* Scene 2 staggered line reveals (33.3% -> 66.6%) */
    .s2-l0 { animation: r20 10.5s ease-out infinite; }
    .s2-l1 { animation: r21 10.5s ease-out infinite; }
    .s2-l2 { animation: r22 10.5s ease-out infinite; }
    .s2-l3 { animation: r23 10.5s ease-out infinite; }
    .s2-l4 { animation: r24 10.5s ease-out infinite; }
    .s2-l5 { animation: r25 10.5s ease-out infinite; }
    .s2-l6 { animation: r26 10.5s ease-out infinite; }

    @keyframes r20 { 0%, 33.3% { opacity: 0; } 35.0%, 100% { opacity: 1; } }
    @keyframes r21 { 0%, 37.5% { opacity: 0; } 39.2%, 100% { opacity: 1; } }
    @keyframes r22 { 0%, 40.2% { opacity: 0; } 41.9%, 100% { opacity: 1; } }
    @keyframes r23 { 0%, 43.2% { opacity: 0; } 44.9%, 100% { opacity: 1; } }
    @keyframes r24 { 0%, 46.2% { opacity: 0; } 47.9%, 100% { opacity: 1; } }
    @keyframes r25 { 0%, 49.2% { opacity: 0; } 50.9%, 100% { opacity: 1; } }
    @keyframes r26 { 0%, 52.2% { opacity: 0; } 53.9%, 100% { opacity: 1; } }

    /* Scene 3 staggered line reveals (66.6% -> 100%) */
    .s3-l0 { animation: r30 10.5s ease-out infinite; }
    .s3-l1 { animation: r31 10.5s ease-out infinite; }
    .s3-l2 { animation: r32 10.5s ease-out infinite; }
    .s3-l3 { animation: r33 10.5s ease-out infinite; }
    .s3-l4 { animation: r34 10.5s ease-out infinite; }
    .s3-l5 { animation: r35 10.5s ease-out infinite; }
    .s3-l6 { animation: r36 10.5s ease-out infinite; }

    @keyframes r30 { 0%, 66.6% { opacity: 0; } 68.3%, 100% { opacity: 1; } }
    @keyframes r31 { 0%, 70.8% { opacity: 0; } 72.5%, 100% { opacity: 1; } }
    @keyframes r32 { 0%, 73.6% { opacity: 0; } 75.3%, 100% { opacity: 1; } }
    @keyframes r33 { 0%, 76.4% { opacity: 0; } 78.1%, 100% { opacity: 1; } }
    @keyframes r34 { 0%, 79.4% { opacity: 0; } 81.1%, 100% { opacity: 1; } }
    @keyframes r35 { 0%, 82.4% { opacity: 0; } 84.1%, 100% { opacity: 1; } }
    @keyframes r36 { 0%, 85.4% { opacity: 0; } 87.2%, 100% { opacity: 1; } }

    /* Blinking terminal cursor */
    .cursor {
      fill: #34d399;
      animation: blink 0.9s steps(2, start) infinite;
    }
    @keyframes blink {
      0%, 55% { opacity: 1; }
      56%, 100% { opacity: 0; }
    }

    /* Footer scene pills and progress bar */
    .pill-1 { animation: p1 10.5s linear infinite; }
    .pill-2 { animation: p2 10.5s linear infinite; }
    .pill-3 { animation: p3 10.5s linear infinite; }

    @keyframes p1 {
      0%, 32.8% { opacity: 1; }
      33.3%, 99.4% { opacity: 0.38; }
      100% { opacity: 1; }
    }
    @keyframes p2 {
      0%, 33.2% { opacity: 0.38; }
      33.6%, 66.1% { opacity: 1; }
      66.6%, 100% { opacity: 0.38; }
    }
    @keyframes p3 {
      0%, 66.5% { opacity: 0.38; }
      66.9%, 99.5% { opacity: 1; }
      100% { opacity: 0.38; }
    }

    .progress-fill {
      transform-origin: 12px 424px;
      animation: sweep 10.5s linear infinite;
    }
    @keyframes sweep {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene-1, .scene-1 text, .scene-1 g, .scene-1 rect {
        animation: none !important;
        opacity: 1 !important;
      }
      .scene-2, .scene-3 {
        animation: none !important;
        opacity: 0 !important;
      }
      .cursor {
        animation: none !important;
        opacity: 0.85 !important;
      }
      .pill-1 { animation: none !important; opacity: 1 !important; }
      .pill-2, .pill-3 { animation: none !important; opacity: 0.38 !important; }
      .progress-fill { animation: none !important; transform: scaleX(0.333); }
    }
  </style>

  <!-- Outer subtle frame background -->
  <rect width="920" height="480" rx="18" fill="url(#canvasBg)"/>

  <!-- Terminal window shell -->
  <rect x="12" y="12" width="896" height="456" rx="14" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header chrome -->
  <path d="M 26 12 H 894 A 14 14 0 0 1 908 26 V 56 H 12 V 26 A 14 14 0 0 1 26 12 Z" fill="#0f172a"/>
  <line x1="12" y1="56" x2="908" y2="56" stroke="#1e293b" stroke-width="1"/>

  <!-- Window dots -->
  <circle cx="34" cy="34" r="6" fill="#ef4444"/>
  <circle cx="54" cy="34" r="6" fill="#f59e0b"/>
  <circle cx="74" cy="34" r="6" fill="#10b981"/>

  <!-- Centered terminal title -->
  <text x="460" y="38" text-anchor="middle" class="ui" fill="#94a3b8" font-size="12" font-weight="600">veycraft — v2.8.0 · 0/0 npm deps · 56 skills</text>

  <!-- Right safety pill -->
  <rect x="780" y="23" width="112" height="22" rx="11" fill="#064e3b" fill-opacity="0.5" stroke="#34d399" stroke-opacity="0.45"/>
  <text x="836" y="38" text-anchor="middle" class="mono" fill="#6ee7b7" font-size="11" font-weight="700">dry_run: true</text>

  <!-- ================= SCENE 1: HEALTH CHECK (0.0s - 3.5s) ================= -->
  <g class="scene-1">
    <g class="s1-l0">
      <text x="36" y="94" class="mono" xml:space="preserve"><tspan class="prompt">$</tspan> <tspan class="cmd">npx --yes veycraft doctor</tspan></text>
      <rect x="254" y="81" width="8" height="16" rx="1.5" class="cursor"/>
    </g>
    <text x="36" y="130" class="mono hdr s1-l1">Veycraft Doctor — ~/career-ops</text>
    <text x="36" y="164" class="mono s1-l2" xml:space="preserve"><tspan class="ok">[✓]</tspan> <tspan class="body">OS &amp; Runtime: linux (x64) · Node 22.x</tspan></text>
    <text x="36" y="194" class="mono s1-l3" xml:space="preserve"><tspan class="ok">[✓]</tspan> <tspan class="body">Agent Home: ~/career-ops (local)</tspan></text>
    <text x="36" y="224" class="mono s1-l4" xml:space="preserve"><tspan class="ok">[✓]</tspan> <tspan class="body">Skill Registry: skills/REGISTRY.md present </tspan><tspan class="em">(56 skills in manifest)</tspan></text>
    <text x="36" y="254" class="mono s1-l5" xml:space="preserve"><tspan class="ok">[✓]</tspan> <tspan class="body">Provenance &amp; Attribution: NOTICE, AUTHORS.md &amp; PROVENANCE.json verified (@redasalem)</tspan></text>
    <text x="36" y="284" class="mono s1-l6" xml:space="preserve"><tspan class="ok">[✓]</tspan> <tspan class="body">Platform Playbook Freshness: 7 playbook(s) verified within 60 days</tspan></text>
    <text x="36" y="314" class="mono s1-l7" xml:space="preserve"><tspan class="ok">[✓]</tspan> <tspan class="body">Git Pre-Commit PII Shield: .git/hooks/pre-commit active</tspan></text>
    <text x="36" y="344" class="mono s1-l8" xml:space="preserve"><tspan class="info">[i]</tspan> <tspan class="muted">Optional NOTION_TOKEN: not set (local JSON mode active)</tspan></text>

    <g class="s1-l8">
      <rect x="36" y="368" width="848" height="34" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="52" y="389" class="mono" font-size="12" xml:space="preserve"><tspan class="ok">READY</tspan> <tspan class="muted">· Zero runtime dependencies · Zero external API keys · Works offline in any AI coding IDE</tspan></text>
    </g>
  </g>

  <!-- ================= SCENE 2: INTENT ROUTING (3.5s - 7.0s) ================= -->
  <g class="scene-2">
    <g class="s2-l0">
      <text x="36" y="94" class="mono" xml:space="preserve"><tspan class="prompt">$</tspan> <tspan class="cmd">veycraft route "tailor my cv to this job"</tspan></text>
      <rect x="380" y="81" width="8" height="16" rx="1.5" class="cursor"/>
    </g>
    <text x="36" y="138" class="mono s2-l1" xml:space="preserve"><tspan class="ok">[✓]</tspan> <tspan class="muted">Matched Intent:</tspan> <tspan class="em">tailor-cv</tspan></text>
    <text x="36" y="170" class="mono s2-l2" xml:space="preserve"><tspan class="info">[i]</tspan> <tspan class="muted">Minimal Skills:</tspan> <tspan class="body">01-resume-ingestion, 03-tailor-resume-and-verify,</tspan></text>
    <text x="36" y="196" class="mono s2-l2" xml:space="preserve">                    <tspan class="body">21-ats-keyword-heatmap, 28-recruiter-brand-and-domain-intelligence</tspan></text>
    <text x="36" y="230" class="mono s2-l3" xml:space="preserve"><tspan class="info">[i]</tspan> <tspan class="muted">Workflow:      </tspan> <tspan class="body">.agent/workflows/quick-tailor.md</tspan></text>
    <text x="36" y="262" class="mono s2-l4" xml:space="preserve"><tspan class="info">[i]</tspan> <tspan class="muted">Readiness:     </tspan> <tspan class="em">task-specific</tspan> <tspan class="body">(CV + 1 JD; zero browser login or /setup required)</tspan></text>
    <text x="36" y="294" class="mono s2-l5" xml:space="preserve"><tspan class="info">[i]</tspan> <tspan class="muted">Outputs:       </tspan> <tspan class="body">resume.html, resume.doc, resume.txt, tailoring-notes.md</tspan></text>
    <text x="36" y="320" class="mono s2-l5" xml:space="preserve">                    <tspan class="muted">(Evidence Map, ATS Heatmap, True Gaps)</tspan></text>

    <g class="s2-l6">
      <rect x="36" y="368" width="848" height="34" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="52" y="389" class="mono" font-size="12" xml:space="preserve"><tspan class="info">PROGRESSIVE DISCLOSURE</tspan> <tspan class="muted">· Loads 4/56 skills for this task — minimal tokens, zero bloat</tspan></text>
    </g>
  </g>

  <!-- ================= SCENE 3: SAFETY GATE (7.0s - 10.5s) ================= -->
  <g class="scene-3">
    <g class="s3-l0">
      <text x="36" y="94" class="mono" xml:space="preserve"><tspan class="prompt">$</tspan> <tspan class="cmd">veycraft pre-submit --text "Short grounded hiring manager note under 75 words."</tspan></text>
      <rect x="676" y="81" width="8" height="16" rx="1.5" class="cursor"/>
    </g>
    <text x="36" y="132" class="mono hdr s3-l1">Veycraft Pre-Submit Deterministic Gate — ~/career-ops</text>
    <text x="36" y="168" class="mono s3-l2" xml:space="preserve"><tspan class="ok">[✓]</tspan> <tspan class="body">Daily Cap OK: </tspan><tspan class="em">0/5</tspan><tspan class="body"> (Warm-up Days 1-3 cap: 5/day, uncertain: 0, </tspan><tspan class="warn">dry_run: ON</tspan><tspan class="body">)</tspan></text>
    <text x="36" y="200" class="mono s3-l3" xml:space="preserve"><tspan class="ok">[✓]</tspan> <tspan class="body">Draft Word Cap OK: </tspan><tspan class="em">8/75 words</tspan><tspan class="body"> (--text)</tspan></text>
    <text x="36" y="236" class="mono s3-l4" xml:space="preserve"><tspan class="info">[i]</tspan> <tspan class="muted">1. APPROVE:</tspan> <tspan class="body">Never click Submit/Save/Post/Send without fresh job-bound owner APPROVE.</tspan></text>
    <text x="36" y="268" class="mono s3-l5" xml:space="preserve"><tspan class="info">[i]</tspan> <tspan class="muted">5. TRUTH:  </tspan> <tspan class="body">Evidence Map only; True Gaps unclaimed (veycraft verify).</tspan></text>
    <text x="36" y="308" class="mono s3-l6" xml:space="preserve"><tspan class="ok">[✓]</tspan> <tspan class="em">Pre-Submit Deterministic Gate PASSED</tspan><tspan class="body"> (requires explicit fresh owner APPROVE).</tspan></text>

    <g class="s3-l6">
      <rect x="36" y="368" width="848" height="34" rx="8" fill="#064e3b" fill-opacity="0.35" stroke="#34d399" stroke-opacity="0.45"/>
      <text x="52" y="389" class="mono" font-size="12" xml:space="preserve"><tspan class="ok">HUMAN-IN-THE-LOOP</tspan> <tspan fill="#a7f3d0">· Explicit Job-Specific APPROVE Required · Zero Blind Submissions</tspan></text>
    </g>
  </g>

  <!-- Footer bar & animated progress indicator -->
  <path d="M 12 424 H 908 V 454 A 14 14 0 0 1 894 468 H 26 A 14 14 0 0 1 12 454 Z" fill="#0f172a"/>
  <line x1="12" y1="424" x2="908" y2="424" stroke="#1e293b" stroke-width="1"/>
  <rect x="12" y="423" width="896" height="2.5" fill="url(#accentBar)" class="progress-fill"/>

  <!-- Left label -->
  <text x="36" y="451" class="ui" fill="#94a3b8" font-size="11.5" font-weight="600">Authentic CLI Output · Zero PII · Pure CSS SVG</text>

  <!-- Right 3-scene step pills -->
  <g class="pill-1">
    <rect x="536" y="435" width="104" height="22" rx="11" fill="#064e3b" fill-opacity="0.55" stroke="#34d399" stroke-opacity="0.6"/>
    <circle cx="550" cy="446" r="3.5" fill="#34d399"/>
    <text x="560" y="450" class="ui" fill="#e2e8f0" font-size="11" font-weight="600">1/3 Health</text>
  </g>
  <g class="pill-2">
    <rect x="650" y="435" width="102" height="22" rx="11" fill="#0c4a6e" fill-opacity="0.55" stroke="#38bdf8" stroke-opacity="0.6"/>
    <circle cx="664" cy="446" r="3.5" fill="#38bdf8"/>
    <text x="674" y="450" class="ui" fill="#e2e8f0" font-size="11" font-weight="600">2/3 Route</text>
  </g>
  <g class="pill-3">
    <rect x="762" y="435" width="128" height="22" rx="11" fill="#064e3b" fill-opacity="0.55" stroke="#34d399" stroke-opacity="0.6"/>
    <circle cx="776" cy="446" r="3.5" fill="#34d399"/>
    <text x="786" y="450" class="ui" fill="#e2e8f0" font-size="11" font-weight="600">3/3 Safety Gate</text>
  </g>
</svg>
